# project-flow 最小 CI。
#
# 设计原则（见 .dsh-ops/briefs/brief-b6-ci.md）：
#   - 零依赖仓库 → 没有 npm install，也不需要任何缓存。
#   - 单 job、单 OS、单 Node 版本：win32 逻辑已由 t-20261030-09-win-compat.test.mjs
#     用注入式（platform: 'win32'）在 Linux 上覆盖；真跑 Windows 矩阵反而会因为
#     state-worker 的 { skip: POSIX === false } 净跳过 9 条、多跑 0 条。
#   - 不引 lint / 覆盖率：那会引入依赖，破坏"随包分发、无构建步骤"的定位。
#
# ⚠️ 刻意**不跑**任何 `flow` CLI 门禁，原因逐条如下（都是实测结论，不是猜测）：
#   1. `flow gate run precommit` —— 第 3 步 `tasks-archive` 会把到期的 done 任务
#      改写成 archived **并写盘**（实测：seed 一条 2020 年的 done 任务，跑门禁后
#      变成 archived）。CI 里每次跑都在改台账，绝不可接受。
#   2. `flow check decisions` —— 它用 `git diff --cached` 找暂存文件；没有暂存区
#      （或 git 报错）时**兜底成空集、仍然 exit 0**。在 CI 里它永远绿 = 没有断言。
#   3. `flow check state` —— 本仓库没有 COLLAB_STATE.md，必红。
#   4. `flow check staged` —— 需要 --allow 与暂存区语义，CI 里无意义。
#   台账格式门禁（check tasks）已由本地 precommit 第 4 步拦截，CI 不必重复。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续推送时取消旧跑，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 实测全套约 40s（unit ~12s + 6 个 selftest ~20s）；15 分钟是防挂死，不是性能指标。
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 代码只用 Object.hasOwn（Node 16.9+）、node:test（18+）、randomUUID（14.17+），
          # 20 是安全下界。不锁小版本，跟随 20.x 最新补丁。
          node-version: '20'

      # ── 结构门禁（2026-11-12 增补，用户指示「加」） ──
      #
      # 只跑**纯文件**检查，不跑任何 `flow` 台账门禁。理由（承接文件头原有 4 条，并补第 5 条）：
      #   · `.agents/` 整目录被 gitignore，CI 检出后**根本没有台账**——precommit 的
      #     decisions / tasks-archive / tasks-format 在 CI 里要么必红、要么恒绿（假断言）；
      #   · precommit 的 tasks-archive 会**写盘**，CI 每次跑都在改台账，不可接受。
      # 所以 CI 只承担「结构门禁」：下面两条都只读已提交文件，且各自对应一类真实事故：
      #   · module-domain → 新增文件未登记归属、锚点被改。实测：CONTRACT.md 的 §6 标题
      #     全角右括号被改成半角，锚点匹配 0 次，门禁红了两天没人查出是一个字符；
      #   · doc-counts    → README 声明的用例数与实测不符。实测：三个实现者并发改
      #     同一数字，955→966 来回漂移。
      # 两者都是 scripts/ 下的零依赖脚本，不读 .agents/，检出即可跑。
      - name: structure (module-domain 归属与锚点)
        run: node scripts/module-domain.mjs verify
        # 红在这里 = 有文件没登记到任何模块，或某个锚点在目标文件里不出现/出现多次/顺序不对。
        # 本地复现：node scripts/module-domain.mjs verify

      - name: structure (README 用例数一致性)
        run: node scripts/doc-counts.mjs
        # 红在这里 = README 声明的用例数/文件数与 test/ 实测不符。
        # 本地修复：node scripts/doc-counts.mjs --fix（**不要手抄数字**）

      # 规则文件监视面（T-20261112183139）：
      #   · 本地 `flow gate rules` 用 store 里的校验和基线判定「改了规则没留痕」；
      #   · CI 没有 .agents/ 台账，所以这里只验证**纯文件层**：监视清单仍能解析
      #     （docs/module-domain.json 存在、CONTRACT.md 的每个锚点区段能定位且唯一）。
      #     锚点漂移会让本地基线比对失效，这一层是它的地基，不依赖任何台账。
      - name: structure (规则文件监视面可解析)
        run: |
          node --input-type=module -e "
            import { snapshotRules } from './lib/gates/rules.mjs'
            import { loadContract } from './lib/store/contract.mjs'
            const root = process.cwd()
            const { contract } = loadContract(root)
            const snapshot = snapshotRules(root, contract)
            if (!snapshot.ok) {
              for (const issue of snapshot.issues) console.error('::error::' + issue.kind + ' ' + issue.path + ' — ' + issue.detail)
              process.exit(1)
            }
            const files = Object.keys(snapshot.files)
            console.log('watched: ' + files.join(', '))
            // 守卫：监视面塌缩成 0/1 个文件时，这一步其实什么也没保护（假绿）。
            if (files.length < 2) {
              console.error('::error::rule watch list collapsed to ' + files.length + ' file(s) - false green')
              process.exit(1)
            }
          "
        # 红在这里 = 锚点被改（from/to 不唯一或顺序不对）或受保护的规则文件不见了。

      # 只用语法检查，不执行任何模块：bin/flow.mjs 顶层会跑 main()，import 它会真的调 CLI。
      # 文件用 find 自动发现（不硬编码清单），新增模块不会静默漏检。
      #
      # 为什么不用 `git ls-files`：在没有 .git 的目录里它**静默返回空**（exit 0），
      # 会让整步变成"检查了 0 个文件"的假绿。find + 空集守卫没有这个陷阱。
      - name: syntax (node --check)
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do
            node --check "$f"
            count=$((count + 1))
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) \
                     -not -path './node_modules/*' \
                     -not -path './test/*' \
                     -not -path './.selftest/*' \
                     -not -path './.dsh-ops/*' | sort)
          echo "checked $count source files"
          # 守卫：路径过滤写错时会匹配到 0 个文件，那一步其实什么也没查。
          if [ "$count" -lt 10 ]; then
            echo "::error::only $count source files matched - the path filter is probably wrong (false green)"
            exit 1
          fi
        # 红在这里 = 某个 .js/.mjs 有语法错（未闭合括号、TS 语法混入、hashbang 位置不对）。
        # 日志里会打印具体文件与行列。

      # test/ 下全部用例。node --test 在有失败时自己退 1，不需要额外判断。
      #
      # 关于 skipped：真实台账体检用例（task-26）在没有真实 .dsh 台账的环境里会
      # 主动 t.skip —— 那是**设计行为，不是失败**。CI 只要退出码为 0，skipped 多少都放过。
      - name: unit (node --test)
        run: node --test test/
        # 红在这里 = test/ 里某条用例失败。日志有 `✖ <用例名>`，本地 `node --test test/` 可复现同一条。

      # .selftest/ 六套宿主/客户端自测。用 ::group:: 折叠，红了能一眼看出是哪个文件；
      # 单个文件失败不中断其余文件（先全部跑完再统一 exit 1），避免"只看到第一个红"。
      - name: selftest (.selftest/*.mjs)
        run: |
          set -uo pipefail
          failed=0
          for f in .selftest/*.mjs; do
            echo "::group::$f"
            if node "$f"; then
              echo "::endgroup::"
            else
              rc=$?
              echo "::error file=$f::selftest failed (exit $rc)"
              echo "::endgroup::"
              failed=1
            fi
          done
          exit "$failed"
        # 红在这里 = 六套自测之一失败，::error file= 直接指向出问题的 .mjs。